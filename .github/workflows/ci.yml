name: CI

on:
  push:
    branches: [main, develop_v2]
  pull_request:
    branches: [main, develop_v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: ci-verification-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: linguaflow_ci
          POSTGRES_PASSWORD: linguaflow_ci
          POSTGRES_DB: linguaflow_ci
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U linguaflow_ci -d linguaflow_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://linguaflow_ci:linguaflow_ci@127.0.0.1:54329/linguaflow_ci
      TEST_DATABASE_URL: postgresql+asyncpg://linguaflow_ci:linguaflow_ci@127.0.0.1:54329/linguaflow_ci_test
      JWT_SECRET: ci-test-secret-with-at-least-thirty-two-characters
      LLM_PROVIDER: openai
      OPENAI_API_KEY: test-key
      EMAIL_PROVIDER: memory

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Lint backend
        run: ruff check src/ tests/ eval/ scripts/

      - name: Validate migration graph
        run: |
          test "$(alembic heads | grep -c '(head)')" -eq 1
          alembic upgrade head
          alembic check

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

      - name: Type-check frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint -- --max-warnings=0

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  production-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop_v2' && needs.lint-and-test.result == 'success'
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_sha: ${{ steps.gate.outputs.release_sha }}
    env:
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Require an associated merged pull request
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: sha,
            });
            const accepted = pullRequests.some((pr) =>
              pr.base?.ref === "develop_v2" &&
              pr.merged_at &&
              pr.merge_commit_sha === sha
            );
            if (!accepted) {
              core.setFailed("Fail closed: release SHA is not an approved merge into develop_v2");
              return;
            }
            core.setOutput("release_sha", sha.toLowerCase());

  build-production-artifacts:
    needs: production-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_digest: ${{ steps.backend.outputs.digest }}
      frontend_digest: ${{ steps.frontend.outputs.digest }}
    env:
      RELEASE_SHA: ${{ needs.production-gate.outputs.release_sha }}
      BACKEND_IMAGE: ghcr.io/linguaflow/linguaflow-backend
      FRONTEND_IMAGE: ghcr.io/linguaflow/linguaflow-frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.production-gate.outputs.release_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ env.RELEASE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}

      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.RELEASE_SHA }}
          labels: org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.PRODUCTION_API_URL }}
            NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID=${{ vars.GOOGLE_OAUTH_CLIENT_ID }}

      - name: Report an incomplete artifact pair
        if: failure() && steps.backend.outcome == 'success'
        run: echo "PARTIAL RELEASE STATE - backend was published but frontend was not"

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop_v2'
    needs: [production-gate, build-production-artifacts]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    concurrency:
      group: linguaflow-production
      cancel-in-progress: false
      # queue: max — GitHub queues production runs because cancellation is disabled.
    environment: production
    env:
      RELEASE_SHA: ${{ needs.production-gate.outputs.release_sha }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.production-gate.outputs.release_sha }}

      - name: Reject a superseded release
        id: freshness
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "develop_v2",
            });
            core.setOutput("current", branch.data.commit.sha === process.env.RELEASE_SHA ? "true" : "false");

      - name: Deploy immutable release
        if: steps.freshness.outputs.current == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          BACKEND_DIGEST: ${{ needs.build-production-artifacts.outputs.backend_digest }}
          FRONTEND_DIGEST: ${{ needs.build-production-artifacts.outputs.frontend_digest }}
        run: sh scripts/deployment/run_remote_release.sh deploy "$RELEASE_SHA" "$BACKEND_DIGEST" "$FRONTEND_DIGEST"

  production-channel-rehearsal:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop_v2'
    needs: [production-gate, build-production-artifacts, deploy-production]
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    concurrency:
      group: linguaflow-production
      cancel-in-progress: false
      # queue: max — serialize rehearsal with deployment.
    environment: production
    env:
      RELEASE_SHA: ${{ needs.production-gate.outputs.release_sha }}
      PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      GHCR_TOKEN: ${{ github.token }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
      BACKEND_DIGEST: ${{ needs.build-production-artifacts.outputs.backend_digest }}
      FRONTEND_DIGEST: ${{ needs.build-production-artifacts.outputs.frontend_digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.production-gate.outputs.release_sha }}

      - name: Rehearse the deployed production channel
        run: sh scripts/deployment/run_remote_release.sh rehearse "$RELEASE_SHA" "$BACKEND_DIGEST" "$FRONTEND_DIGEST"
