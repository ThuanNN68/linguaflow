[pytest]
# The project had no pytest configuration file at all; this one exists for the
# filter below and deliberately sets nothing else, so every other default stays
# exactly where it was.
#
# Why the filter: a few WebSocket tests close a socket on purpose while the
# server is still handling the frame (test_ack_lost_reconnect_... is the whole
# point of one of them). Cancelling a request suspended inside `get_db`'s
# `yield` means the dependency never reaches its `finally`, so the session is
# closed only when the async generator is finalised — after the loop is gone.
# SQLAlchemy then warns from inside the garbage collector, pytest turns any
# unraisable warning into an error, and it lands on whichever test happens to be
# running at that moment rather than the one that abandoned the connection.
#
# That made the suite report failures unrelated to the change under test: adding
# a table to models.py was enough to move the collection point and redden a
# WebSocket test that nothing had touched. The leaked object is one connection
# to a temporary SQLite file, and the production server never cancels a request
# this way, so the warning carries no signal here.
#
# Scoped to this exact message rather than to SAWarning as a class: a real
# connection leak that says anything else still fails the suite.
filterwarnings =
    ignore:The garbage collector is trying to clean up non-checked-in connection.*:sqlalchemy.exc.SAWarning
markers =
    postgres: requires a live PostgreSQL server with pgvector and pg_trgm
    isolated: does not require a live database and can run as the fast local suite
